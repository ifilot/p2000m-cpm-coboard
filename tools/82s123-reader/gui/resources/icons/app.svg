<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Flat rounded-square background -->
  <rect x="8" y="8" width="240" height="240" rx="46" fill="#182430"/>

  <!-- DIP-package chip pins -->
  <g stroke="#c9a227" stroke-width="14" stroke-linecap="round">
    <line x1="38"  y1="96"  x2="66"  y2="96"/>
    <line x1="38"  y1="128" x2="66"  y2="128"/>
    <line x1="38"  y1="160" x2="66"  y2="160"/>

    <line x1="190" y1="96"  x2="218" y2="96"/>
    <line x1="190" y1="128" x2="218" y2="128"/>
    <line x1="190" y1="160" x2="218" y2="160"/>
  </g>

  <!-- Chip body -->
  <rect x="64" y="56" width="128" height="144" rx="14" fill="#eef2f6" stroke="#0d1620" stroke-width="5"/>

  <!-- Pin-1 notch -->
  <circle cx="128" cy="56" r="13" fill="#182430"/>

  <!-- Memory-array hint (rows of bits) -->
  <g fill="#7c8a97">
    <rect x="84"  y="90"  width="20" height="20" rx="3"/>
    <rect x="118" y="90"  width="20" height="20" rx="3"/>
    <rect x="152" y="90"  width="20" height="20" rx="3"/>

    <rect x="84"  y="124" width="20" height="20" rx="3"/>
    <rect x="118" y="124" width="20" height="20" rx="3"/>
    <rect x="152" y="124" width="20" height="20" rx="3"/>

    <rect x="84"  y="158" width="20" height="20" rx="3"/>
    <rect x="118" y="158" width="20" height="20" rx="3"/>
    <rect x="152" y="158" width="20" height="20" rx="3"/>
  </g>
</svg>
